name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  continuity:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: sh -n apc scripts/check.sh scripts/init.sh scripts/install.sh scripts/test.sh
      - name: Run test suite
        run: sh scripts/test.sh
      - name: Validate distributions
        run: |
          sh ./apc check template
          sh ./apc check examples/sample-project
